name: Auto release
# Every merge to main that changes the plugin or the deck engine publishes a
# patch pre-release, so BRAT in the owner's vault (and anyone else using it)
# picks it up on the next Obsidian start. Docs-only merges don't release.
# The version-bump commit is pushed with GITHUB_TOKEN, which does not trigger
# this workflow again.
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'reveal-dist/**'
      - 'package.json'
      - 'esbuild.config.mjs'

concurrency:
  group: auto-release
  cancel-in-progress: false

jobs:
  release:
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/release.yml
    with:
      version: patch
      prerelease: true
