name: Release Obsidian Plugin
# Manual trigger only (UI or API). Bumps the version, builds the plugin and the
# reveal.js distribution assets, packages slidey.zip, and publishes a GitHub
# Release with all the artifacts the plugin needs at runtime.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'New version (x.y.z) or one of: major, minor, patch'
        default: 'patch'
        required: true
      prerelease:
        description: 'Mark the GitHub Release as a pre-release'
        default: true
        required: true
        type: boolean

env:
  GH_BOT_EMAIL: "41898282+github-actions[bot]@users.noreply.github.com"
  GH_BOT_NAME: "GitHub Action"
  ZIP_ARTIFACT: slidey.zip

jobs:
  build:
    permissions:
      contents: write
      id-token: write
      attestations: write
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.build.outputs.version }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # persist-credentials required: this step pushes the version-bump commit and tag
      with:
        fetch-depth: 0

    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

    - name: Use Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 24
        cache: "pnpm"

    - name: Bump version, commit and tag
      id: build
      env:
        INPUT_VERSION: ${{ github.event.inputs.version }}
      run: |
        git config user.name "$GH_BOT_NAME"
        git config user.email "$GH_BOT_EMAIL"

        pnpm install --frozen-lockfile

        npm version "$INPUT_VERSION" --no-git-tag-version
        VERSION=$(node -p "require('./package.json').version")
        echo "version $VERSION"

        if git rev-parse "refs/tags/$VERSION" > /dev/null 2>&1; then
          echo "::error::Tag $VERSION already exists. Delete the release and tag, then re-run."
          exit 1
        fi

        # manifest.json, manifest-beta.json and distVersion.json all track package.json's version
        for f in manifest.json manifest-beta.json distVersion.json; do
          node -e "const fs=require('fs');const p='$f';const j=JSON.parse(fs.readFileSync(p));j.version='$VERSION';fs.writeFileSync(p, JSON.stringify(j, null, 2) + '\n');"
        done

        git add package.json manifest.json manifest-beta.json distVersion.json
        git commit -m "🔖 $VERSION"
        git push
        git tag "$VERSION"
        git push --tags

        # Best-effort changelog; a bare autogenerated body is fine if this fails
        pnpm run brat-notes -- "$VERSION" || echo "Release $VERSION" > release-notes.md
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"

    - name: Build plugin
      run: pnpm run build

    - name: Build reveal.js distribution assets
      run: |
        pnpm --dir reveal-dist install --frozen-lockfile
        pnpm --dir reveal-dist build

    - name: Package slidey.zip
      run: |
        cp ./build/main.js ./build/styles.css .
        mkdir tmp
        cp -r ./reveal-dist/build/css ./reveal-dist/build/dist ./reveal-dist/build/plugin ./reveal-dist/build/template distVersion.json tmp/
        (cd tmp && zip -r "../${ZIP_ARTIFACT}" ./*)

    - name: Verify distVersion matches the tag
      env:
        RELEASE_VERSION: ${{ steps.build.outputs.version }}
      run: |
        DIST_VERSION=$(unzip -p "${ZIP_ARTIFACT}" distVersion.json | grep -o '"[0-9][0-9.]*"' | tr -d '"')
        echo "release: $RELEASE_VERSION, distVersion: $DIST_VERSION"
        if [ "$DIST_VERSION" != "$RELEASE_VERSION" ]; then
          echo "::error::distVersion.json ($DIST_VERSION) does not match release tag ($RELEASE_VERSION) -- installs would loop re-downloading"
          exit 1
        fi

    - name: Attest build artifacts
      uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
      with:
        subject-path: |
          ${{ env.ZIP_ARTIFACT }}
          ./main.js
          ./styles.css

    - name: Create the GitHub Release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        RELEASE_VERSION: ${{ steps.build.outputs.version }}
        PRERELEASE: ${{ github.event.inputs.prerelease }}
      run: |
        gh release create "$RELEASE_VERSION" \
            -F ./release-notes.md \
            --title "$RELEASE_VERSION" \
            --verify-tag \
            --prerelease="$PRERELEASE" \
            "${ZIP_ARTIFACT}" \
            ./main.js \
            ./styles.css \
            ./manifest.json \
            ./manifest-beta.json
